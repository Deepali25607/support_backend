version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - npm ci --omit=dev
run:
  command: node src/index.js
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: production
  # NOTE: MONGODB_URI, MONGODB_DB and JWT_SECRET are secrets — do NOT put them
  # here. Add them in the App Runner console under "Environment variables".
